<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Nexo Humano</title>
  <desc id="desc">Imagen de respaldo para servicios de talento humano.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#2F4F90"/>
      <stop offset="45%" stop-color="#4A6FB1"/>
      <stop offset="100%" stop-color="#A9C4E8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>
  <circle cx="1240" cy="180" r="220" fill="#ffffff" opacity="0.08"/>
  <circle cx="300" cy="960" r="250" fill="#ffffff" opacity="0.06"/>
  <rect x="150" y="150" width="1300" height="900" rx="32" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.25"/>
  <rect x="260" y="260" width="1080" height="90" rx="18" fill="#ffffff" opacity="0.12"/>
  <rect x="260" y="430" width="460" height="420" rx="18" fill="#ffffff" opacity="0.12"/>
  <rect x="760" y="430" width="580" height="160" rx="18" fill="#ffffff" opacity="0.10"/>
  <rect x="760" y="620" width="580" height="230" rx="18" fill="#ffffff" opacity="0.10"/>
  <text x="800" y="710" text-anchor="middle" fill="#ffffff" font-size="64" font-family="Poppins, Arial, sans-serif" font-weight="700" letter-spacing="2">NEXO HUMANO</text>
  <text x="800" y="780" text-anchor="middle" fill="#EAF1FF" font-size="28" font-family="Poppins, Arial, sans-serif" font-weight="500" letter-spacing="6">TALENTO CON PROPÓSITO</text>
</svg>
